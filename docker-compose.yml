# Coolify: set the domain of the "bulten" service to https://bulten.openwild.ai:3000
# and paste the variables from .env.production into the Environment Variables tab.
services:
  bulten:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - APP_URL=${APP_URL:-https://bulten.openwild.ai}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?}
      - SESSION_SECRET=${SESSION_SECRET:?}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?}
      - R2_ENDPOINT=${R2_ENDPOINT:?}
      - R2_BUCKET=${R2_BUCKET:-bulten-cdn}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:?}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:?}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-https://bulten-cdn.openwild.ai}
    volumes:
      - bulten-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  bulten-data:
